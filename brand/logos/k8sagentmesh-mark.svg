<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="K8sAgentMesh primary mark (full color, for dark surfaces)" viewBox="0 0 512 512" width="512" height="512">
  <title>K8sAgentMesh primary mark (full color, for dark surfaces)</title>
  <!-- K8sAgentMesh master mark — Viking North-Cross Constellation Compass
       Refined from the locked base north-cross-v2-bots.svg .
       Optical fixes vs v2: diagonal compass points rebuilt as clean symmetric
       tapers (the SE point in v2 was collinear and invisible, the other three
       were twisted ~2px slivers); bot optics tuned for mid-size legibility. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#101B30"/>
      <stop offset="60%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#070D17"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DE9FA"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ray45" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- agent bot: chip-head, two eyes, side mesh pins, antenna tipped with a star -->
    <g id="bot">
      <line x1="0" y1="-11" x2="0" y2="-20" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
      <path d="M 0 -27.5 L 2.7 -21.4 L 0 -22.6 L -2.7 -21.4 Z" fill="#E0FBFF"/>
      <rect x="-13" y="-11" width="26" height="23" rx="7.5" fill="#0E1B2E" stroke="url(#ray)" stroke-width="2.4"/>
      <circle cx="-4.8" cy="0" r="3.1" fill="#A5F3FC"/>
      <circle cx="4.8" cy="0" r="3.1" fill="#A5F3FC"/>
      <line x1="-13" y1="4" x2="-17.5" y2="4" stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="13" y1="4" x2="17.5" y2="4" stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- one diagonal compass point (upper-right); 90-degree rotations around the
         hub center produce the other three, guaranteeing symmetry -->
    <path id="dray" d="M 362 150 L 266.6 252.5 L 256 256 L 259.5 245.4 Z"/>
  </defs>

  <!-- constellation mesh: the cross rays ARE the mesh edges, plugging into bots -->
  <g stroke-width="2" opacity="0.85" stroke-linecap="round">
    <line x1="256" y1="128" x2="256" y2="384" stroke="url(#ray)" opacity="0.9"/>
    <line x1="128" y1="256" x2="384" y2="256" stroke="url(#ray)" opacity="0.9"/>
    <line x1="168" y1="168" x2="344" y2="344" stroke="url(#ray45)" opacity="0.45" stroke-dasharray="1 7"/>
    <line x1="344" y1="168" x2="168" y2="344" stroke="url(#ray45)" opacity="0.45" stroke-dasharray="1 7"/>
    <path d="M 128 256 Q 256 120 384 256" fill="none" stroke="#22D3EE" opacity="0.35" stroke-dasharray="1 6"/>
    <path d="M 128 256 Q 256 392 384 256" fill="none" stroke="#22D3EE" opacity="0.35" stroke-dasharray="1 6"/>
    <!-- taut sail arcs on the mast: abstract sailing nod -->
    <path d="M 262 148 Q 352 220 262 300" fill="none" stroke="#5EEAD4" opacity="0.5" stroke-width="2.5"/>
    <path d="M 250 168 Q 188 224 250 292" fill="none" stroke="#5EEAD4" opacity="0.35" stroke-width="2"/>
    <!-- agent-to-agent side links from bots to scattered stars -->
    <line x1="128" y1="256" x2="112" y2="180" stroke="#22D3EE" opacity="0.3" stroke-dasharray="1 5"/>
    <line x1="384" y1="256" x2="400" y2="196" stroke="#22D3EE" opacity="0.3" stroke-dasharray="1 5"/>
    <line x1="256" y1="384" x2="150" y2="380" stroke="#22D3EE" opacity="0.3" stroke-dasharray="1 5"/>
    <line x1="384" y1="256" x2="396" y2="352" stroke="#22D3EE" opacity="0.3" stroke-dasharray="1 5"/>
  </g>

  <!-- north-star compass cross: long cardinal points, shorter diagonal points -->
  <g filter="url(#glow)">
    <path d="M 256 96 L 268 244 L 256 256 L 244 244 Z" fill="url(#ray)"/>
    <path d="M 256 416 L 268 268 L 256 256 L 244 268 Z" fill="url(#ray)" opacity="0.9"/>
    <path d="M 96 256 L 244 268 L 256 256 L 244 244 Z" fill="url(#ray)" opacity="0.9"/>
    <path d="M 416 256 L 268 268 L 256 256 L 268 244 Z" fill="url(#ray)" opacity="0.9"/>
    <g fill="url(#ray45)" opacity="0.75">
      <use href="#dray"/>
      <use href="#dray" transform="rotate(90 256 256)"/>
      <use href="#dray" transform="rotate(180 256 256)"/>
      <use href="#dray" transform="rotate(270 256 256)"/>
    </g>
    <!-- hub core: double circle, cyan halo + white center -->
    <circle cx="256" cy="256" r="14" fill="#E0FBFF"/>
    <circle cx="256" cy="256" r="7" fill="#FFFFFF"/>
  </g>

  <!-- AGENT BOTS at the four arm ends; north bot ~18% larger (leader/hub) -->
  <g filter="url(#glowSm)">
    <use href="#bot" transform="translate(256,118) scale(1.18)"/>
    <use href="#bot" x="256" y="384"/>
    <use href="#bot" x="384" y="256"/>
    <use href="#bot" x="128" y="256"/>
  </g>

  <!-- secondary agents: small stars on the diagonals and scattered -->
  <g fill="#A5F3FC" filter="url(#glowSm)">
    <circle cx="168" cy="168" r="5"/>
    <circle cx="344" cy="168" r="5"/>
    <circle cx="168" cy="344" r="5"/>
    <circle cx="344" cy="344" r="5"/>
    <circle cx="112" cy="180" r="3.5" opacity="0.7"/>
    <circle cx="400" cy="196" r="3.5" opacity="0.7"/>
    <circle cx="150" cy="380" r="3.5" opacity="0.7"/>
    <circle cx="396" cy="352" r="3.5" opacity="0.7"/>
  </g>

  <!-- north pointer accent above the north bot -->
  <path d="M 256 60 L 263 74 L 256 71 L 249 74 Z" fill="#E0FBFF" opacity="0.9" filter="url(#glowSm)"/>
</svg>
